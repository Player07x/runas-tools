name: Deploy Runas Tools to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runas-tools-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: "076845eb75724529d83e92307f7df356"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate shared business rules
        run: npm test && npm run typecheck

      - name: Verify Runas DM production build
        run: npm run build:dm

      - name: Build static site
        run: npm run build:tools

      - name: Verify offline artifacts
        run: |
          test -f apps/runas-tools/out/sw.js
          test -f apps/runas-tools/out/manifest.webmanifest
          test -f apps/runas-tools/out/icon-192.png
          test -f apps/runas-tools/out/icon-512.png
          test -f apps/runas-dm/dist/client/sw.js
          test -f apps/runas-dm/dist/client/icon-192.png
          test -f apps/runas-dm/dist/client/icon-512.png

      - name: Enforce JavaScript budget
        run: npm run check:bundle -w @runas/tools

      - name: Audit performance and accessibility
        run: npm run lighthouse -w @runas/tools

      - name: Deploy Runas Tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          npx wrangler pages deploy apps/runas-tools/out \
            --project-name runas-tools \
            --branch main \
            --commit-hash ${{ github.sha }} \
            --commit-message "Automated Runas Tools deployment" \
            --commit-dirty=false
