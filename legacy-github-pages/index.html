<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runas Tools mudou de endereço</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%23101827%22/><text x=%2232%22 y=%2244%22 text-anchor=%22middle%22 font-size=%2238%22 fill=%22%23f5c451%22>ᚱ</text></svg>" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #26375b, #0c111d 60%); color: #fff; }
      main { width: min(680px, 100%); padding: clamp(28px, 6vw, 56px); text-align: center; border: 1px solid #6478a8; border-radius: 24px; background: rgb(13 20 35 / .9); box-shadow: 0 24px 80px #0008; }
      .rune { font-size: 64px; color: #f5c451; }
      h1 { font-size: clamp(1.7rem, 5vw, 2.6rem); line-height: 1.2; }
      p { color: #cbd5e1; font-size: 1.15rem; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 30px; }
      a { min-width: 210px; padding: 14px 20px; border-radius: 12px; background: #f5c451; color: #111827; font-weight: 800; text-decoration: none; }
      a:last-child { background: #91a7ff; }
      .rescue { margin-top: 34px; padding-top: 28px; border-top: 1px solid #6478a8; }
      .rescue strong { color: #fff; }
      button { padding: 14px 20px; border: 0; border-radius: 12px; background: #67e8b5; color: #111827; font: inherit; font-weight: 800; cursor: pointer; }
      a:hover, a:focus-visible { transform: translateY(-2px); outline: 3px solid #fff; outline-offset: 3px; }
      button:hover, button:focus-visible { transform: translateY(-2px); outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="rune" aria-hidden="true">ᚱ</div>
      <h1>Ei, parece que migramos de endereço!</h1>
      <p>Se quiser, você pode conferir nossa nova localização:</p>
      <nav aria-label="Novos endereços">
        <a href="https://runas-tools.pages.dev/">Acessar Runas Tools</a>
        <a href="https://runas-dm.pages.dev/">Acessar Runas DM</a>
      </nav>
      <section class="rescue" aria-labelledby="rescue-title">
        <p id="rescue-title"><strong>Sua ficha ficou presa aqui? NÃO TEM PROBLEMA, EXPORTE SUAS FICHAS AGORA, POR AQUI:</strong></p>
        <button id="export-gallery" type="button">Exportar todas as fichas da galeria</button>
        <p id="export-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script>
      const status = document.querySelector('#export-status');
      const encoder = new TextEncoder();
      const crc32 = data => { let crc=0xffffffff; for(const byte of data){crc^=byte; for(let bit=0;bit<8;bit++) crc=(crc>>>1)^((crc&1)?0xedb88320:0)} return (crc^0xffffffff)>>>0 };
      const header = size => { const bytes=new Uint8Array(size); return {bytes,view:new DataView(bytes.buffer)} };
      const join = chunks => { const result=new Uint8Array(chunks.reduce((n,c)=>n+c.length,0)); let offset=0; for(const chunk of chunks){result.set(chunk,offset);offset+=chunk.length} return result };
      function createZip(files){const local=[],central=[];let offset=0;for(const file of files){const name=encoder.encode(file.name),data=encoder.encode(file.content),crc=crc32(data),lh=header(30);lh.view.setUint32(0,0x04034b50,true);lh.view.setUint16(4,20,true);lh.view.setUint32(14,crc,true);lh.view.setUint32(18,data.length,true);lh.view.setUint32(22,data.length,true);lh.view.setUint16(26,name.length,true);local.push(lh.bytes,name,data);const ch=header(46);ch.view.setUint32(0,0x02014b50,true);ch.view.setUint16(4,20,true);ch.view.setUint16(6,20,true);ch.view.setUint32(16,crc,true);ch.view.setUint32(20,data.length,true);ch.view.setUint32(24,data.length,true);ch.view.setUint16(28,name.length,true);ch.view.setUint32(42,offset,true);central.push(ch.bytes,name);offset+=lh.bytes.length+name.length+data.length}const cd=join(central),end=header(22);end.view.setUint32(0,0x06054b50,true);end.view.setUint16(8,files.length,true);end.view.setUint16(10,files.length,true);end.view.setUint32(12,cd.length,true);end.view.setUint32(16,offset,true);return join([...local,cd,end.bytes])}
      function readGallery(){return new Promise((resolve,reject)=>{const request=indexedDB.open('runas-tools',1);request.onerror=()=>reject(request.error);request.onsuccess=()=>{const db=request.result;const tx=db.transaction('character-sections','readonly');const get=tx.objectStore('character-sections').get('character-gallery');get.onerror=()=>reject(get.error);get.onsuccess=()=>{db.close();resolve(get.result?.value?.entries||[])}}})}
      document.querySelector('#export-gallery').addEventListener('click',async()=>{try{let entries=await readGallery();if(!entries.length){const legacy=localStorage.getItem('runas.character.v1');if(legacy) entries=[{character:JSON.parse(legacy).character}]}if(!entries.length) throw new Error('Nenhuma ficha foi encontrada neste navegador.');const safe=(value,index)=>(value||`personagem_${index+1}`).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'_');const files=entries.map((entry,index)=>({name:`${String(index+1).padStart(2,'0')}_${safe(entry.character?.name,index)}.json`,content:JSON.stringify({version:3,character:entry.character},null,2)}));const blob=new Blob([createZip(files)],{type:'application/zip'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='galeria_personagens_json.zip';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=`${entries.length} ficha(s) exportada(s) com sucesso.`}catch(error){status.textContent=error.message||'Não foi possível exportar as fichas.'}});
    </script>
  </body>
</html>
