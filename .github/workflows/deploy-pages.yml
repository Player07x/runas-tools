name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Validate shared business rules
        run: npm test && npm run typecheck

      - name: Verify Runas DM production build
        run: npm run build:dm

      - name: Build static site
        run: npm run build:tools

      - name: Verify offline artifacts
        run: |
          test -f apps/runas-tools/out/sw.js
          test -f apps/runas-tools/out/manifest.webmanifest
          test -f apps/runas-tools/out/icon-192.png
          test -f apps/runas-tools/out/icon-512.png
          test -f apps/runas-dm/dist/client/sw.js
          test -f apps/runas-dm/dist/client/icon-192.png
          test -f apps/runas-dm/dist/client/icon-512.png

      - name: Enforce JavaScript budget
        run: npm run check:bundle -w @runas/tools

      - name: Audit performance and accessibility
        run: npm run lighthouse -w @runas/tools

      - name: Disable Jekyll processing
        run: touch apps/runas-tools/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/runas-tools/out
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
